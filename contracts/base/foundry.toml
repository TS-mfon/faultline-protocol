[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
solc_version = "0.8.30"
auto_detect_solc = false
offline = true
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
fuzz = { runs = 512 }

[fmt]
# Keep explicit multi-line control-flow blocks; avoid compact-block formatter rewrites.
single_line_statement_blocks = "multi"
