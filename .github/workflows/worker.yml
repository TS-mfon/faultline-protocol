name: Faultline testnet worker
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: faultline-testnet-attestor
  cancel-in-progress: false
jobs:
  advance:
    if: vars.FAULTLINE_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: testnet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run run --workspace @faultline/worker
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          GENLAYER_RPC_URL: ${{ secrets.GENLAYER_RPC_URL }}
          GENLAYER_EVM_RPC_URL: ${{ secrets.GENLAYER_EVM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GENLAYER_CONTRACT_ADDRESS: ${{ vars.GENLAYER_CONTRACT_ADDRESS }}
          BASE_ESCROW_ADDRESS: ${{ vars.BASE_ESCROW_ADDRESS }}
          GENLAYER_CODE_HASH: ${{ vars.GENLAYER_CODE_HASH }}
          BASE_CODE_HASH: ${{ vars.BASE_CODE_HASH }}
          ATTESTOR_ADDRESS: ${{ vars.ATTESTOR_ADDRESS }}
          ATTESTOR_PRIVATE_KEY: ${{ secrets.ATTESTOR_PRIVATE_KEY }}
          FAULTLINE_WEBHOOK_URL: ${{ secrets.FAULTLINE_WEBHOOK_URL }}
          FAULTLINE_WEBHOOK_SECRET: ${{ secrets.FAULTLINE_WEBHOOK_SECRET }}
